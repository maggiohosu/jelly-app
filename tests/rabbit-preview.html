<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Bunny preview</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/three.webgpu.min.js",
        "three/webgpu": "../vendor/three/three.webgpu.min.js",
        "three/tsl": "../vendor/three/three.tsl.min.js",
        "three/addons/": "../vendor/three/addons/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #dfe6e8; overflow: hidden; font: 12px/1.35 -apple-system, system-ui, sans-serif; color: #44545b; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hud { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100vw - 16px); }
    #hud button { font: inherit; border: 0; border-radius: 9px; padding: 6px 10px; background: #ffffffcc; color: #44545b; box-shadow: 0 1px 2px #0001; }
    #hud button.on { background: #44545b; color: #fff; }
    #hud .sep { width: 6px; }
    #status { position: fixed; left: 8px; bottom: 8px; font-variant-numeric: tabular-nums; opacity: 0.8; }
    #log { position: fixed; right: 8px; bottom: 30px; width: 230px; max-height: 34vh; overflow: hidden; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #3d4a50; background: #ffffff8c; border-radius: 10px; padding: 6px 8px; white-space: pre; }
    body.clean #hud, body.clean #status, body.clean #log { display: none; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <div id="log"></div>
  <div id="status"></div>
  <script type="module" src="./rabbit-preview.js"></script>
</body>
</html>
