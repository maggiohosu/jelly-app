<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Decor preview</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/three.webgpu.min.js",
        "three/webgpu": "../vendor/three/three.webgpu.min.js",
        "three/tsl": "../vendor/three/three.tsl.min.js",
        "three/addons/": "../vendor/three/addons/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #dfe6e8; overflow: hidden; font: 12px/1.4 -apple-system, system-ui, sans-serif; color: #44545b; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; left: 8px; top: 6px; }
    #hud a { color: inherit; margin-right: 6px; }
    #hud a.on { font-weight: 700; text-decoration: none; color: #1d2a30; }
    #icons { position: fixed; left: 0; right: 0; bottom: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #icons div { display: flex; gap: 4px; }
    #icons span { display: inline-flex; width: 48px; height: 48px; background: #ffffffb0; border-radius: 12px; }
    #icons span svg { width: 100%; height: 100%; }
    #icons.big span { width: 96px; height: 96px; border-radius: 20px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <div id="icons"></div>
  <script type="module" src="./decor-preview.js"></script>
</body>
</html>
